# AUROC-only front-end study: best_sota with the Triad (3D MRI foundation model, PlainConvUNet MAE) stage-3
# encoder map (fe_triad_mae_s3_all.npy, 768 ch on 12 x 12 per slice) as an external front end; one seed.
paths:
  images_dir: /data/picai_images
  labels_dir: /data/picai_labels
  fold_lists: /data/picai_fold{f}_files.txt
  fold_slices: /data/picai_fold{f}_zones.npz
  slices: /data/picai_all_masks.npz
  feature_cache: /workspace/wafer-hdc/mri_feature_cache/resnet_l2.npy
  out: /data/auroc/maps_triad_s3
  adc_raw: /workspace/wafer-hdc/mri_feature_cache/adc_raw.npy
data:
  size: 96
model:
  patch: 20
  stride: 2
  slice_levels: 5
  num_proj: 512
  num_levels: 4
  clip_value: 4.0
  n_sub:
  - 20
  - 5
  epochs: 20
  lr: 2.0
  softmax_t: 0.02
  lesion_frac: 0.25
  bin_cap: 50000
  smooth_sigma: 2.0
  features: external
  feature_path: /data/auroc/fe/fe_triad_mae_s3_all.npy
  readout: pooled_bilinear
  pca: 128
  pca_cols: 768
ensemble_seeds:
- 0
extraction:
  sxy: 0.0
  sz: 1.0
  q: 99.0
  tf: 1.0
  mapping: sigmoid
  mode: dynamic-fast
  factor: 2.0
  minvox: 25
  nles: 5
  adj: false
  conf: top10pct
  gamma: 0.0
rescorer:
  seed: 0
  epochs_grid:
  - 50
  alpha_grid:
  - 0.25
  - 0.5
  extra_fields:
  - a_mean
  - a_p10
  - rim
  kind: hdc+knn
  epochs: 50
  k_grid:
  - 20
  - 40
  - 80
  - 160
patient:
  fields:
  - psad
  - psa
  - prostate_volume
  - patient_age
  merge_grid:
  - 0.25
run:
  parallel_jobs: 3
  threads: 10
  workers: 16
