# Put this file in the root of your fork of Eric's repo, then run:  uv sync
[project]
name = "wafer-hdc-mri"
version = "0.1.0"
description = "WaferHDC (ASP-DAC'27) adapted to PI-CAI prostate MRI"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "torch",
    "torchvision",
    "SimpleITK",
    "matplotlib",
    "picai-eval>=1.4.13",
    "faiss-cpu>=1.15.1",
    "optuna>=5.0.0",
    "timm>=1.0.31",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false   # a folder of scripts, not an installable package

# CUDA 12.8 PyTorch (Blackwell GPUs need cu128). The HDC code itself runs on CPU; the GPU is only used to
# fine-tune the ResNet front end (HDnn). For a CPU-only machine, switch the index URL back to .../whl/cpu.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
